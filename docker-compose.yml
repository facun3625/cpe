services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpe
      POSTGRES_PASSWORD: cpe
      POSTGRES_DB: cpe
    ports:
      - "5441:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpe -d cpe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
